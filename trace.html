<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trace — Lily Suh</title>
<style>
  @font-face {
    font-family: "Mabry Pro";
    src: local("Mabry Pro"), local("MabryPro-Regular"), url("fonts/MabryPro-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --orange: #53b4fa;
    --font: 'Mabry Pro','HelveticaNeue','Helvetica Neue',Helvetica,Arial,sans-serif;
    --text: #111;
    --muted: #999;
    --border: rgba(0,0,0,0.09);
  }

  /* ── Global nav (shared with index.html) ── */
  .nav-wrap {
    position: fixed;
    bottom: 48px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 200;
  }
  .pill {
    width: 120px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05), 0 2px 16px rgba(0,0,0,0.04);
    overflow: hidden;
    transition: width 0.35s cubic-bezier(0.4,0,0.2,1), box-shadow 0.3s ease, border-radius 0.35s ease, transform 0.15s cubic-bezier(0.34,1.4,0.64,1);
    will-change: width;
  }
  .pill.open {
    width: 720px;
    border-radius: 20px;
    box-shadow: 0 4px 32px rgba(0,0,0,0.10), 0 16px 56px rgba(0,0,0,0.07);
  }
  .pill-bar {
    display: flex;
    align-items: center;
    height: 64px;
    padding: 0 22px 0 18px;
    position: relative;
  }
  .pill:has(.pill-bar:active) { transform: scale(1.04); }
  .gem {
    width: 30px; height: 30px;
    flex-shrink: 0;
    cursor: pointer;
  }
  @keyframes spin360 {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .gem.spinning { animation: spin360 0.7s cubic-bezier(0.34,1.1,0.64,1) forwards; }
  .gem-dash {
    transform-origin: 50px 50px;
    transition: transform 0.36s cubic-bezier(0.4,0,0.2,1);
  }
  .pill.open .gem-dash { transform: rotate(-45deg); }
  .pill-name {
    position: absolute;
    left: 0; right: 0;
    text-align: center;
    z-index: 0;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--text);
    pointer-events: none;
    user-select: none;
    cursor: pointer;
  }
  .burger {
    margin-left: auto;
    flex-shrink: 0;
    align-self: stretch;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 9px;
    padding: 0 2px;
    cursor: pointer;
    background: none;
    border: none;
    outline: none;
    position: relative;
    z-index: 2;
  }
  .burger span {
    display: block;
    width: 22px; height: 2px;
    background: var(--text);
    border-radius: 99px;
    transform-origin: center;
    transition: transform 0.22s cubic-bezier(0.4,0,0.2,1), opacity 0.18s ease;
  }
  .pill.open .burger span:nth-child(1) { transform: translateY(5.5px) rotate(45deg); }
  .pill.open .burger span:nth-child(2) { transform: translateY(-5.5px) rotate(-45deg); }
  .pill-body {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.35s cubic-bezier(0.4,0,0.2,1);
  }
  .pill.open .pill-body { grid-template-rows: 1fr; }
  .pill-body-inner { overflow: hidden; }
  .pill-body-content {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 32px;
    padding: 4px 22px 24px;
    align-items: center;
  }
  .pill-nav-links { display: flex; flex-direction: column; justify-content: center; }
  .pill-nav-links a {
    display: block;
    font-size: 34px;
    font-weight: 500;
    letter-spacing: -0.035em;
    line-height: 1.22;
    color: var(--text);
    text-decoration: none;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.18s ease, transform 0.22s cubic-bezier(0.34,1.2,0.64,1), color 0.16s ease;
    transition-delay: 0s !important;
  }
  .pill.open .pill-nav-links a { opacity: 1; transform: translateY(0); }
  .pill.open .pill-nav-links a:nth-child(1) { transition-delay: 0.08s !important; }
  .pill.open .pill-nav-links a:nth-child(2) { transition-delay: 0.11s !important; }
  .pill.open .pill-nav-links a:nth-child(3) { transition-delay: 0.14s !important; }
  .pill.open .pill-nav-links a:nth-child(4) { transition-delay: 0.17s !important; }
  .pill-nav-links a:hover { color: var(--muted); }
  .pill-cards {
    display: flex;
    gap: 8px;
    align-items: stretch;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.18s ease 0.08s, transform 0.22s cubic-bezier(0.34,1.1,0.64,1) 0.08s;
  }
  .pill.open .pill-cards { opacity: 1; transform: translateY(0); }
  .card {
    flex: 1;
    background: #EBEBEB;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    transition: transform 0.2s ease;
    display: flex;
    flex-direction: column;
    padding: 10px;
    gap: 8px;
  }
  .card:hover { transform: scale(1.015); }
  .card-img-wrap {
    width: 100%;
    aspect-ratio: 4/5;
    overflow: hidden;
    flex-shrink: 0;
    border-radius: 7px;
  }
  .card-img-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }
  .card-label {
    padding: 0 2px;
    font-size: 11px;
    font-weight: 400;
    color: var(--text);
    line-height: 1.35;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 4px;
    flex-shrink: 0;
  }
  .card-arrow { color: #888; font-size: 14px; flex-shrink: 0; }
  .pill-foot {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 12px;
    font-size: 10px;
    letter-spacing: 0.02em;
    color: var(--muted);
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.18s ease 0.18s, transform 0.18s ease 0.18s;
  }
  .pill.open .pill-foot { opacity: 1; transform: translateY(0); }

  html, body {
    background: #fff;
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    color: #111;
  }

  /* ── Wrapper ── */
  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 0 32px;
  }

  /* ── Header ── */
  .hero-bg {
    background: #1e1e25;
    border-radius: 0;
    margin: 0 0 0 220px;
  }
  .cs-header {
    padding: 200px 80px 120px 80px;
    text-align: left;
  }

  .cs-title {
    font-size: 42px;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.1;
    color: #f3f3f3;
    margin-bottom: 8px;
  }

  .cs-subtitle {
    font-size: 15px;
    font-weight: 400;
    color: #bababa;
    line-height: 1.6;
    max-width: 700px;
    margin-bottom: 48px;
  }

  .cs-meta {
    display: flex;
    gap: 48px;
    margin-top: 52px;
    justify-content: flex-start;
  }

  .cs-meta-label {
    font-size: 15px;
    font-weight: 500;
    color: #656566;
    margin-bottom: 5px;
  }

  .cs-meta-value {
    font-size: 15px;
    font-weight: 400;
    color: #bababa;
  }

  /* ── Accordion layout ── */
  .case-layout {
    margin: 0 0 80px 220px;
    padding: 60px 80px;
  }
  .case-sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 220px;
    height: 100vh;
    background: #fff;
    border-right: none;
    padding: 120px 28px 40px;
    z-index: 50;
    overflow-y: auto;
  }

  .sidebar-back {
    display: block;
    font-size: 13px;
    color: #999;
    text-decoration: none;
    margin-bottom: 32px;
    transition: color 0.15s;
  }
  .sidebar-back:hover { color: #111; }

  .accordion-item { border-bottom: none; }
  .accordion-item:first-child { border-top: none; }

  .accordion-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 0;
    cursor: pointer;
    background: none;
    border: none;
    width: 100%;
    text-align: left;
    font-family: var(--font);
  }

  .accordion-icon {
    display: none;
    transition: color 0.15s;
  }

  .accordion-label {
    font-size: 15px;
    font-weight: 400;
    color: #bbb;
    flex: 1;
    line-height: 1.2;
    letter-spacing: -0.02em;
    font-family: var(--font);
    transition: color 0.15s;
  }

  .accordion-arrow { display: none; }

  .accordion-item:hover .accordion-label,
  .accordion-item:hover .accordion-icon { color: #555; }
  .accordion-item:hover .accordion-arrow { border-color: #aaa; color: #555; }

  .accordion-item.active .accordion-label,
  .accordion-item.active .accordion-icon { color: #111; }
  .accordion-item.active .accordion-arrow { border-color: #888; color: #111; }

  /* ── Item stepper ── */
  .item-stepper { margin-top: 20px; flex: 1; display: flex; flex-direction: column; }
  .stepper-slides-wrap { width: 100%; flex: 1; display: flex; flex-direction: column; }
  .stepper-nav {
    display: flex;
    justify-content: flex-end;
    margin-top: 12px;
  }
  .stepper-slide { display: none; }
  .stepper-slide.active { display: flex; flex: 1; flex-direction: column; }
  .stepper-btn {
    position: absolute;
    right: -20px;
    top: 50%;
    transform: translateY(-50%);
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1.5px solid #e0e0e0;
    background: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: #333;
    font-family: var(--font);
    transition: border-color 0.15s, color 0.15s;
    line-height: 1;
    z-index: 1;
  }
  .stepper-btn:hover { border-color: #888; color: #111; }


  .case-content { min-width: 0; }

  .tab-panel { display: block; }
  .tab-panel + .tab-panel { margin-top: 80px; padding-top: 80px; border-top: none; }

  /* ── Key Screens — always-visible section, left-aligned like header ── */
  .key-screens-section {
    margin-top: 60px;
    padding: 0 180px;
  }

  /* ── Section utility ── */
  .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--orange);
    margin-bottom: 10px;
  }

  .section-title {
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -0.025em;
    line-height: 1.2;
    color: #111;
    margin-bottom: 14px;
  }

  .section-body {
    font-size: 17px;
    font-weight: 400;
    color: #444;
    line-height: 1.7;
    margin-bottom: 10px;
  }

  .section-sub {
    font-size: 15px;
    color: #aaa;
    line-height: 1.6;
  }

  /* ── Context card ── */
  .stepper-card-wrap {
    position: relative;
    margin-bottom: 48px;
  }
  .context-outer-card {
    border: 1.5px solid #e5e5e5;
    border-radius: 20px;
    padding: 20px;
    height: 640px;
    box-sizing: border-box;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .context-intro {
    font-size: 15px;
    color: #555;
    line-height: 1.65;
    margin-bottom: 10px;
  }

  .context-intro strong { color: #111; font-weight: 500; }

  .edu-portal-box {
    background: #fff;
    border: 1.5px solid #ececec;
    border-radius: 14px;
    padding: 12px 16px;
    box-sizing: border-box;
  }

  .edu-portal-box-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: #bbb;
    margin-bottom: 18px;
  }

  .edu-icons-row {
    display: flex;
    gap: 20px;
    align-items: flex-end;
  }

  .edu-app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .edu-icon {
    width: 52px;
    height: 52px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .edu-icon-label {
    font-size: 11px;
    color: #999;
    font-weight: 400;
  }

  /* ── Placeholder card ── */
  .placeholder-card {
    border: 1.5px solid #e5e5e5;
    background: #fff;
    border-radius: 20px;
    height: 640px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 48px;
  }

  .placeholder-card-title {
    font-size: 16px;
    font-weight: 500;
    color: #bbb;
    letter-spacing: -0.01em;
  }

  .placeholder-card-sub {
    font-size: 15px;
    color: #ccc;
  }

  /* ── Feature rows ── */
  .feature-section {
    margin-bottom: 120px;
  }

  .feature-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 64px;
    align-items: center;
  }

  .img-placeholder {
    width: 100%;
    aspect-ratio: 4/3;
    background: #f2f2f2;
    border-radius: 16px;
  }

  /* ── Bottom padding ── */
  .page-end { padding-bottom: 120px; }

  body.cs-fullscreen .cs-subtitle { max-width: 760px; }
  body.cs-fullscreen .case-content { max-width: 760px; }
  body.cs-fullscreen .section-body { max-width: 760px; }

  /* ── Next project ── */
  .next-project {
    border-top: 1px solid #e8e8e8;
    padding: 64px 120px 100px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }

  .next-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #bbb;
    font-family: var(--font);
  }

  .next-link {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    font-size: 36px;
    font-weight: 500;
    letter-spacing: -0.03em;
    color: #111;
    text-decoration: none;
    font-family: var(--font);
    transition: opacity 0.18s ease;
  }

  .next-link:hover { opacity: 0.5; }

  .next-arrow {
    font-size: 32px;
    line-height: 1;
  }

  .card { flex: 0 0 144px !important; }
  .pill-cards { justify-content: flex-end !important; }
</style>

<style id="tr-styles">
:root{--tr-lime:#d5ff5f;--tr-card:#1e1e25;--tr-surface:#252530;--tr-page:#2d2d36;--tr-text:#111;--tr-sub:#555;--tr-muted:#999;--tr-r:16px;--tr-br:12px;}

.tr-overline{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tr-lime);background:rgba(213,255,95,.08);border:1px solid rgba(213,255,95,.2);border-radius:99px;padding:4px 12px;margin-bottom:20px;}
.tr-h1{font-size:clamp(28px,4vw,52px);font-weight:500;letter-spacing:-.03em;line-height:1.05;color:var(--tr-text);margin:0 0 14px;}

.tr-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;}

.tr-demo{margin-top:32px;border-radius:20px;border:1px solid rgba(213,255,95,.25);box-shadow:0 0 60px rgba(213,255,95,.08);background:var(--tr-card);overflow:hidden;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;}
.tr-demo-ph{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--tr-muted);font-size:13px;font-weight:500;letter-spacing:.04em;}
.tr-stat-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:28px;}
.tr-stat-card{background:var(--tr-card);border:1px solid rgba(255,255,255,.06);border-radius:var(--tr-r);padding:26px 22px;}

.tr-prob-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px;}

.tr-prob-icon{width:32px;height:32px;background:rgba(213,255,95,.08);border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;color:var(--tr-lime);}
.tr-prob-title{font-size:14px;font-weight:700;color:var(--tr-text);margin-bottom:6px;}
.tr-prob-body{font-size:12px;color:var(--tr-sub);line-height:1.6;}
.tr-flow-wrap{margin-top:32px;display:flex;flex-direction:column;gap:14px;}

.tr-flow-node.lime{color:#111;background:var(--tr-lime);border-color:var(--tr-lime);font-weight:700;}

.tr-methods-ttl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tr-muted);margin-bottom:14px;}

.tr-qcard{background:var(--tr-card);border:1px solid rgba(255,255,255,.06);border-radius:var(--tr-r);padding:22px;margin-top:24px;}

.tr-scroll{overflow-x:auto;padding-bottom:20px;margin-top:32px;scrollbar-width:thin;scrollbar-color:rgba(213,255,95,.2) transparent;}

.tr-col{display:flex;flex-direction:column;align-items:center;gap:8px;}
.tr-col-lbl{font-size:10px;color:var(--tr-muted);font-weight:500;letter-spacing:.05em;}
.tr-popup{width:320px;background:var(--tr-card);border-radius:18px;border:1px solid rgba(255,255,255,.07);box-shadow:0 16px 48px rgba(0,0,0,.6);overflow:hidden;flex-shrink:0;}
.tr-topbar{display:flex;align-items:center;padding:12px 14px;gap:7px;border-bottom:1px solid rgba(255,255,255,.05);}
.tr-logo{width:22px;height:22px;background:var(--tr-lime);border-radius:5px;flex-shrink:0;}
.tr-wm{font-size:13px;font-weight:800;color:var(--tr-text);letter-spacing:-.02em;flex:1;}
.tr-badge{font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#111;background:var(--tr-lime);border-radius:99px;padding:3px 7px;}
.tr-pbody{padding:14px;}
.tr-ph1{font-size:16px;font-weight:800;color:var(--tr-text);letter-spacing:-.02em;line-height:1.2;margin-bottom:5px;}
.tr-psub{font-size:11px;color:var(--tr-sub);line-height:1.5;margin-bottom:12px;}
.tr-scard{background:var(--tr-surface);border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:12px;margin-bottom:8px;cursor:pointer;}
.tr-scard-title{font-size:12px;font-weight:700;color:var(--tr-text);margin-bottom:2px;}

.tr-btn{display:block;width:100%;padding:11px;background:var(--tr-lime);color:#111;font-family:inherit;font-size:12px;font-weight:700;border:none;border-radius:10px;cursor:pointer;text-align:center;margin-top:10px;box-sizing:border-box;}
.tr-ghost{display:block;width:100%;padding:9px;background:transparent;color:var(--tr-muted);font-family:inherit;font-size:11px;font-weight:500;border:1px solid rgba(255,255,255,.08);border-radius:10px;cursor:pointer;text-align:center;margin-top:6px;box-sizing:border-box;}
.tr-cflow{display:flex;align-items:flex-end;gap:12px;margin:14px 0;}
.tr-ci{display:flex;flex-direction:column;align-items:center;gap:3px;}
.tr-cp{font-size:22px;font-weight:800;color:var(--tr-lime);letter-spacing:-.03em;line-height:1;}
.tr-cp.s{font-size:15px;color:var(--tr-muted);text-decoration:line-through;font-weight:600;}
.tr-cl{font-size:9px;color:var(--tr-muted);text-align:center;font-weight:500;letter-spacing:.04em;}
.tr-ca{color:var(--tr-muted);font-size:12px;padding-bottom:12px;}
.tr-dc{background:var(--tr-surface);border-radius:11px;padding:12px;margin:10px 0;}

.tr-dc-row:last-child{margin-bottom:0;}
.tr-dc-row .l{color:var(--tr-muted);}
.tr-dc-row .v{color:var(--tr-text);font-weight:600;}
.tr-dc-row .v.lime{color:var(--tr-lime);}
.tr-dc-row .v.s{text-decoration:line-through;color:var(--tr-muted);font-weight:400;}
.tr-pimg{height:140px;background:#f5f3ef;border-radius:10px;position:relative;overflow:hidden;margin-bottom:10px;}
.tr-pimg-bdg{position:absolute;font-size:8px;font-weight:700;letter-spacing:.05em;border-radius:99px;padding:2px 7px;}
.tr-pimg-bdg.site{top:7px;left:7px;background:rgba(0,0,0,.55);color:#fff;}
.tr-pimg-bdg.det{top:7px;right:7px;background:var(--tr-lime);color:#111;}
.tr-s4c{text-align:center;padding:4px 0;}
.tr-s4ring{width:48px;height:48px;border-radius:50%;border:2px solid var(--tr-lime);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:var(--tr-lime);}
.tr-lbc{border:1px solid rgba(213,255,95,.25);background:rgba(213,255,95,.04);border-radius:11px;padding:12px;margin:10px 0;font-size:11px;}
.tr-lbc .r{display:flex;justify-content:space-between;margin-bottom:4px;color:var(--tr-sub);}
.tr-lbc .r .l{color:var(--tr-muted);}
.tr-lbc .r .v.lime{color:var(--tr-lime);font-weight:700;}
.tr-lbc .note{font-size:9px;color:var(--tr-muted);margin-top:6px;line-height:1.5;}
.tr-chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.tr-bchip{font-size:10px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.1);background:var(--tr-surface);color:var(--tr-sub);cursor:pointer;}
.tr-bchip.sel{border-color:var(--tr-lime);background:rgba(213,255,95,.08);color:var(--tr-lime);}
.tr-clbl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tr-muted);margin:8px 0 5px;}
.tr-sldr-wrap{margin:12px 0;}
.tr-sldr-lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--tr-muted);margin-bottom:5px;}
.tr-sldr{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:99px;background:linear-gradient(to right,var(--tr-lime) 60%,var(--tr-page) 60%);outline:none;}
.tr-sldr::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:pointer;}
.tr-flbl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tr-muted);margin:10px 0 6px;}
.tr-fcard{display:flex;gap:9px;background:var(--tr-surface);border-radius:10px;padding:9px;margin-bottom:7px;align-items:center;}

.tr-finfo{flex:1;min-width:0;}
.tr-fname{font-size:11px;font-weight:600;color:var(--tr-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1px;}
.tr-fwas{font-size:9px;color:var(--tr-muted);text-decoration:line-through;}
.tr-fbid{font-size:11px;font-weight:700;color:var(--tr-lime);}
.tr-fbtn{font-size:9px;font-weight:700;background:var(--tr-lime);color:#111;border:none;border-radius:7px;padding:4px 9px;cursor:pointer;flex-shrink:0;}
.tr-widget-wrap{margin-top:40px;}
.tr-widget-lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tr-muted);margin-bottom:14px;text-align:center;}
.tr-widget-pg{background:var(--tr-page);border:1px solid rgba(255,255,255,.06);border-radius:var(--tr-r);padding:24px;display:flex;align-items:flex-start;gap:24px;}
.tr-wprod{flex:1;}
.tr-wprod-lbl{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--tr-muted);margin-bottom:6px;}
.tr-wprod-name{font-size:17px;font-weight:700;color:var(--tr-text);margin-bottom:5px;line-height:1.2;}
.tr-wprod-price{font-size:18px;font-weight:800;color:var(--tr-text);margin-bottom:3px;}
.tr-wprod-sub{font-size:11px;color:var(--tr-muted);}
.tr-wcard{width:260px;flex-shrink:0;background:var(--tr-card);border:1px solid rgba(255,255,255,.07);border-radius:var(--tr-r);padding:16px;box-shadow:0 10px 32px rgba(0,0,0,.5);}
.tr-wcard-top{display:flex;align-items:center;gap:7px;margin-bottom:12px;}
.tr-wlogo{width:18px;height:18px;background:var(--tr-lime);border-radius:4px;}
.tr-wwm{font-size:12px;font-weight:800;color:var(--tr-text);}
.tr-wtag{font-size:9px;color:var(--tr-muted);margin-left:auto;}
.tr-wbadges{display:flex;gap:5px;margin-bottom:12px;}
.tr-wbadge{font-size:9px;font-weight:600;border-radius:99px;padding:3px 8px;background:rgba(213,255,95,.1);color:var(--tr-lime);border:1px solid rgba(213,255,95,.2);}
.tr-wflow{display:flex;align-items:center;gap:5px;font-size:10px;margin-bottom:14px;color:var(--tr-muted);}
.tr-wflow .lime{color:var(--tr-lime);font-weight:700;}
.tr-tw-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px;}
.tr-tw-card{background:var(--tr-card);border:1px solid rgba(255,255,255,.06);border-radius:var(--tr-r);padding:22px 18px;}
.tr-tw-num{font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--tr-lime);margin-bottom:8px;}
.tr-tw-title{font-size:14px;font-weight:700;color:var(--tr-text);margin-bottom:8px;line-height:1.3;}
.tr-tw-body{font-size:12px;color:var(--tr-sub);line-height:1.65;}
.tr-closing{text-align:center;font-size:15px;font-style:italic;color:var(--tr-sub);margin:48px auto 0;max-width:560px;line-height:1.7;}
@media(max-width:700px){.tr-stat-row,.tr-prob-row,.tr-res-cols,.tr-tw-row{grid-template-columns:1fr}.tr-widget-pg{flex-direction:column}.tr-wcard{width:100%}}
/* restore light text inside dark card mockups */
.tr-popup,.tr-widget-pg,.tr-qcard{--tr-text:#f3f3f3;--tr-sub:#bababa;--tr-muted:#656566;}
</style>
</head>
<body>

<div class="case-layout">

  <!-- Sidebar nav -->
  <aside class="case-sidebar">
    <a href="#" class="sidebar-back" onclick="if(window.parent && window.parent.closeCaseStudy){ window.parent.closeCaseStudy(); } else { window.location.href='index.html#projects'; } return false;">Back</a>
    <div class="case-sidebar-sticky">
      <div class="accordion-item active" data-tab="0">
        <button class="accordion-header">
          <span class="accordion-icon"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5,3 15,9 5,15" fill="none"/></svg></span>
          <span class="accordion-label">Intro</span>
        </button>
      </div>
      <div class="accordion-item" data-tab="1">
        <button class="accordion-header">
          <span class="accordion-icon"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M9 2C6 2 3.5 4.5 3.5 7.5c0 2 1 3.8 2.5 4.8V14h6v-1.7c1.5-1 2.5-2.8 2.5-4.8C14.5 4.5 12 2 9 2z"/><line x1="6.5" y1="15.5" x2="11.5" y2="15.5"/></svg></span>
          <span class="accordion-label">Brand Concept</span>
        </button>
      </div>
      <div class="accordion-item" data-tab="2">
        <button class="accordion-header">
          <span class="accordion-icon"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="7"/><circle cx="6.5" cy="7" r="1" fill="currentColor" stroke="none"/><circle cx="11.5" cy="7" r="1" fill="currentColor" stroke="none"/><circle cx="6" cy="11" r="1" fill="currentColor" stroke="none"/><path d="M11 12.5c1-.3 1.5-1 1.5-2"/></svg></span>
          <span class="accordion-label">Visual Identity</span>
        </button>
      </div>
    </div>
  </aside>

  <!-- Content panels -->
  <div class="case-content">
    <div class="tab-panel" id="panel-0"></div>
    <div class="tab-panel" id="panel-1"></div>
    <div class="tab-panel" id="panel-2"></div>
  </div>

</div><!-- /case-layout -->


<script>
(function() {
  /* ── Scrollspy sidebar ── */
  var accordionItems = document.querySelectorAll('.accordion-item');
  var panels = document.querySelectorAll('.tab-panel');

  // Clicking sidebar scrolls to section
  accordionItems.forEach(function(item) {
    item.querySelector('.accordion-header').addEventListener('click', function() {
      var idx = parseInt(item.dataset.tab);
      panels[idx].scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });

  // Scrollspy: highlight sidebar item for section in view
  function onScroll() {
    var scrollY = window.scrollY + window.innerHeight * 0.25;
    var active = 0;
    panels.forEach(function(panel, i) {
      if (panel.getBoundingClientRect().top + window.scrollY <= scrollY) {
        active = i;
      }
    });
    accordionItems.forEach(function(item, i) {
      item.classList.toggle('active', i === active);
    });
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  /* ── Global nav pill ── */
  var pill = document.querySelector('.pill');
  var gem  = document.querySelector('.gem');
  if (pill && gem) {
    gem.addEventListener('click', function(e) {
      e.stopPropagation();
      gem.classList.add('spinning');
      gem.addEventListener('animationend', function() {
        window.location.href = 'index.html';
      }, { once: true });
    });
    document.addEventListener('click', function(e) {
      if (!pill.contains(e.target)) pill.classList.remove('open');
    });
    var burger = pill.querySelector('.burger');
    if (burger) {
      burger.addEventListener('click', function(e) {
        e.stopPropagation();
        pill.classList.toggle('open');
      });
    }
  }
})();

  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'cs-fullscreen') {
      document.body.classList.toggle('cs-fullscreen', e.data.value);
    }
  });
</script>

</body>
</html>
